<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CRM Lomarosa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a0a10;--card:#2a1019;--border:#3d1a28;--fg:#f5e0e8;--muted:#a07080;--accent:#ff4081;--ff:'DM Sans',sans-serif}
body{font-family:var(--ff);background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:380px;text-align:center}
.lc h1{font-size:28px;font-weight:800;color:var(--accent)}.lc>p{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:2px;text-transform:uppercase}
.field{margin-top:18px;text-align:left}.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}.field label .req{color:var(--accent)}
.err{color:#ef4444;font-size:13px;margin-top:14px;display:none}
input,select,textarea{width:100%;padding:10px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:rgba(26,10,16,.8);color:var(--fg);outline:none;font-family:var(--ff)}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer;appearance:auto}textarea{resize:vertical;min-height:50px}
.btn{padding:9px 18px;font-size:13px;font-weight:700;border-radius:8px;border:none;cursor:pointer;font-family:var(--ff)}.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:var(--accent);color:#fff}.bs{background:transparent;border:1px solid var(--border);color:var(--fg)}.bsm{padding:7px 12px;font-size:12px}
.blg{width:100%;margin-top:20px;padding:13px;font-size:15px;font-weight:700;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-family:var(--ff)}
.app{display:none;min-height:100vh}.app.show{display:flex}
.mh{display:none;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;justify-content:space-between}
.mh h1{font-size:16px;font-weight:800;color:var(--accent)}.mh .ub{font-size:10px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:20px}
.mn{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--border);padding:5px 0 env(safe-area-inset-bottom,5px);justify-content:space-around}
.mn button{background:none;border:none;color:var(--muted);font-size:9px;font-family:var(--ff);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px}.mn button.act{color:var(--accent)}.mn .ic{font-size:16px}
.sb{width:190px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:10}
.sb .logo{padding:0 16px 16px;border-bottom:1px solid var(--border)}.sb .logo h1{font-size:20px;font-weight:800;color:var(--accent);margin:0}.sb .logo>p{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.sb .ui{padding:10px 16px;border-bottom:1px solid var(--border);font-size:11px}.sb .ui .nm{font-weight:700}.sb .ui .rl{color:var(--muted);font-size:10px;margin-top:2px}
.sb nav{margin-top:8px;flex:1;overflow-y:auto}.sb nav button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 16px;font-size:12px;font-weight:500;color:var(--muted);background:transparent;border:none;cursor:pointer;text-align:left;border-right:3px solid transparent;font-family:var(--ff)}
.sb nav button.act{font-weight:700;color:var(--accent);background:rgba(255,64,129,.1);border-right-color:var(--accent)}
.sb .ft{padding:8px 16px;border-top:1px solid var(--border)}.sb .ft button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;font-family:var(--ff)}
.main{flex:1;padding:20px;margin-left:190px;overflow-y:auto;min-height:100vh}
h2{font-size:18px;font-weight:800;margin:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.stat .bar{position:absolute;top:0;left:0;right:0;height:3px}.stat .lb{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px}.stat .vl{font-size:20px;font-weight:800;margin-top:3px}
.tw{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border)}tr{cursor:pointer}tr:hover td{background:rgba(255,64,129,.05)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;display:inline-block}
.ba{background:rgba(255,64,129,.15);color:var(--accent)}.bg{background:rgba(16,185,129,.15);color:#10b981}.bgy{background:rgba(160,112,128,.15);color:var(--muted)}.bb{background:rgba(99,102,241,.15);color:#818cf8}.by{background:rgba(245,158,11,.15);color:#f59e0b}
.fc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.st{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.grid{display:grid;gap:12px;margin-bottom:20px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.fa{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.toast{position:fixed;top:16px;right:16px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;align-items:center;gap:10px;max-width:360px;font-family:var(--ff)}.toast.show{display:flex}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.rbtn{padding:10px 14px;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--fg);font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;text-align:center}.rbtn.sel{border-color:var(--accent);background:rgba(255,64,129,.15);color:var(--accent)}
.mbtn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--ff);font-size:11px;cursor:pointer}.mbtn.sel{border-color:#f59e0b;background:rgba(245,158,11,.15);color:#f59e0b}
.tabs{display:flex;gap:0;margin-bottom:0}.tabs button{padding:12px 24px;font-size:14px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--border);border-bottom:none;cursor:pointer;font-family:var(--ff);border-radius:8px 8px 0 0;margin-right:-1px}.tabs button.act{color:var(--accent);background:var(--bg);border-bottom:2px solid var(--bg);font-weight:800}
.tab-body{border:1px solid var(--border);border-radius:0 8px 8px 8px;background:var(--bg);padding:20px}
.det-table{width:100%;border-collapse:collapse;font-size:12px}.det-table th{background:rgba(255,64,129,.15);color:var(--accent);padding:10px 8px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase}.det-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.det-table input{padding:6px 8px;width:70px;text-align:center;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px}
.psr{position:relative;margin-bottom:16px}.psr-r{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;z-index:5;display:none}.psr-r.show{display:block}.psr-r div{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}.psr-r div:hover{background:rgba(255,64,129,.1)}
.resumen-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}.resumen-row.total{font-size:20px;font-weight:800;color:#10b981;border-bottom:none;padding-top:12px;border-top:2px solid var(--border)}.resumen-row.discount{color:var(--accent)}
.btn-enviar{background:#10b981;color:#fff;padding:14px 32px;font-size:16px;font-weight:800;border:none;border-radius:10px;cursor:pointer;font-family:var(--ff)}.btn-enviar:disabled{opacity:.5}
@media(max-width:768px){.sb{display:none}.mh{display:flex}.mn{display:flex}.main{margin-left:0;padding:60px 12px 72px}.g3,.g2{grid-template-columns:1fr}.stats{flex-direction:column}.topbar{flex-direction:column;align-items:flex-start}h2{font-size:16px}.fc{padding:16px 12px}.tabs button{padding:8px 14px;font-size:12px}.tab-body{padding:14px}.det-table{font-size:11px}}
</style>
</head>
<body>
<div id="scr-login" class="lw"><div class="lc"><h1>LOMAROSA</h1><p>CRM</p>
<div class="field"><label>Usuario</label><input id="l-user" placeholder="Ej: VEN001" autocomplete="username" autofocus></div>
<div class="field"><label>Contraseña</label><input id="l-pass" type="password" placeholder="••••••••"></div>
<div class="err" id="l-err"></div><button class="blg" onclick="doLogin()">Ingresar</button></div></div>
<div id="scr-chpw" class="lw" style="display:none"><div class="lc"><h1 style="font-size:20px;margin-bottom:6px">Cambiar contraseña</h1>
<div class="field"><label>Nueva</label><input id="cp-n" type="password" placeholder="Mínimo 6"></div>
<div class="field"><label>Confirmar</label><input id="cp-c" type="password"></div>
<div class="err" id="cp-err"></div><button class="blg" onclick="doChPw()">Cambiar</button></div></div>
<div class="app" id="scr-app">
<div class="mh"><h1>LOMAROSA</h1><span class="ub" id="m-badge"></span></div>
<div class="sb"><div class="logo"><h1>LOMAROSA</h1><p>CRM</p></div><div class="ui"><div class="nm" id="s-name"></div><div class="rl" id="s-role"></div></div>
<nav id="snav"></nav><div class="ft"><button onclick="logout()">⏻ Cerrar sesión</button></div></div>
<div class="mn" id="mnav"></div><div class="main" id="mc"></div></div>
<div class="toast" id="toast"><span id="toast-msg"></span><button style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px" onclick="hideT()">×</button></div>
<script>
const SB="https://pqcgibsdewrrbukibubd.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxY2dpYnNkZXdycmJ1a2lidWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3OTQyMDQsImV4cCI6MjA5MDM3MDIwNH0.7WnJydoru0E_aOGkyMGxPgZXTAEVmu4KQwqPPM-W14A";
let U=null,vendedores=[],tipologias=[],sectores=[],listasP=[],clientes=[],visitas=[],productos=[],pedidos=[],supIds=[];
let editingId=null,pedLineas=[],pedTab=1,_pedData={},_visMode="visita",_visClId=null;
const DEPTOS={"Cundinamarca":["Bogotá D.C.","Soacha","Facatativá","Zipaquirá","Chía","Fusagasugá","Girardot","Madrid","Mosquera","Funza","Cajicá","Cota","La Calera","Tenjo","Sopó","Tocancipá","Sibaté","Villeta"],"Antioquia":["Medellín","Bello","Itagüí","Envigado","Rionegro","Sabaneta"],"Atlántico":["Barranquilla","Soledad"],"Bolívar":["Cartagena"],"Boyacá":["Tunja","Duitama","Sogamoso"],"Caldas":["Manizales"],"Cesar":["Valledupar"],"Córdoba":["Montería"],"Huila":["Neiva"],"Meta":["Villavicencio"],"Norte de Santander":["Cúcuta"],"Quindío":["Armenia"],"Risaralda":["Pereira"],"Santander":["Bucaramanga","Floridablanca"],"Tolima":["Ibagué"],"Valle del Cauca":["Cali","Palmira"]};
const RESULTADOS=["Pedido","Cotización","Sin pedido","No atendido","Cerrado","Seguimiento"];
const MOTIVOS=["Cliente tiene stock","No desea producto","Cerrado","No atendieron","Precio no competitivo","Problema calidad","Otro"];
async function api(t,m="GET",b=null,q=""){const h={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};if(m==="POST"||m==="PATCH")h.Prefer="return=representation";const o={method:m,headers:h};if(b)o.body=JSON.stringify(b);const r=await fetch(SB+"/rest/v1/"+t+q,o);if(!r.ok)throw new Error(await r.text());const x=await r.text();return x?JSON.parse(x):null}
function $(id){return document.getElementById(id)}
function fmt(n){return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",minimumFractionDigits:0}).format(n)}
function fmtN(n){return new Intl.NumberFormat("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}
function today(){return new Date().toISOString().slice(0,10)}
function showT(m,t="success"){const e=$("toast");e.style.background=t==="success"?"#10b981":t==="error"?"#ef4444":"#f59e0b";$("toast-msg").textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),4000)}
function hideT(){$("toast").classList.remove("show")}
// AUTH
async function doLogin(){const user=$("l-user").value.trim().toUpperCase(),pass=$("l-pass").value,err=$("l-err");err.style.display="none";if(!user||!pass){err.textContent="Ingresa usuario y contraseña";err.style.display="block";return}try{const r=await api("crm_usuarios","GET",null,"?usuario=eq."+user+"&contrasena=eq."+encodeURIComponent(pass)+"&activo=eq.true");if(!r||!r.length){err.textContent="Incorrecto";err.style.display="block";return}U=r[0];localStorage.setItem("crm_s",JSON.stringify(U));if(U.primer_login){$("scr-login").style.display="none";$("scr-chpw").style.display="flex"}else enterApp()}catch(e){err.textContent=e.message;err.style.display="block"}}
async function doChPw(){const n=$("cp-n").value,c=$("cp-c").value,err=$("cp-err");err.style.display="none";if(n.length<6){err.textContent="Mínimo 6";err.style.display="block";return}if(n!==c){err.textContent="No coinciden";err.style.display="block";return}try{await api("crm_usuarios","PATCH",{contrasena:n,primer_login:false},"?id=eq."+U.id);U.primer_login=false;localStorage.setItem("crm_s",JSON.stringify(U));showT("Contraseña cambiada");enterApp()}catch(e){err.textContent=e.message;err.style.display="block"}}
function logout(){U=null;localStorage.removeItem("crm_s");$("scr-app").classList.remove("show");$("scr-chpw").style.display="none";$("scr-login").style.display="flex";$("l-pass").value=""}
async function enterApp(){$("scr-login").style.display="none";$("scr-chpw").style.display="none";$("scr-app").classList.add("show");
const rl={admin:"Admin",lider:"Líder",vendedor:"Vendedor"};$("s-name").textContent=U.nombre_display;$("s-role").textContent=rl[U.rol];$("m-badge").textContent=U.usuario;
if(U.rol==="lider"){try{const r=await api("crm_lider_vendedores","GET",null,"?lider_usuario_id=eq."+U.id);supIds=(r||[]).map(x=>x.vendedor_id);if(U.vendedor_id&&!supIds.includes(U.vendedor_id))supIds.push(U.vendedor_id)}catch(e){supIds=[]}}
buildNav();await loadAll();showView("dashboard")}
function buildNav(){
const items=[{id:"dashboard",ic:"📊",l:"Dashboard"},{id:"nueva-visita",ic:"📍",l:"Nueva visita"},{id:"visitas",ic:"📋",l:"Hist. visitas"},{id:"pedidos",ic:"📦",l:"Hist. pedidos"},{id:"clientes",ic:"👥",l:"Clientes"},{id:"nuevo-cliente",ic:"✚",l:"Nuevo cliente"}];
if(U.rol!=="vendedor")items.push({id:"exportar",ic:"📥",l:"Exportar ERP"});
$("snav").innerHTML=items.map(i=>`<button onclick="showView('${i.id}')" id="nav-${i.id}">${i.ic} <span>${i.l}</span></button>`).join("");
const mi=[{id:"dashboard",ic:"📊",l:"Inicio"},{id:"nueva-visita",ic:"📍",l:"Visita"},{id:"pedidos",ic:"📦",l:"Pedidos"},{id:"clientes",ic:"👥",l:"Clientes"}];
if(U.rol!=="vendedor")mi.push({id:"exportar",ic:"📥",l:"ERP"});
$("mnav").innerHTML=mi.map(i=>`<button onclick="showView('${i.id}')" id="mn-${i.id}"><span class="ic">${i.ic}</span>${i.l}</button>`).join("")+`<button onclick="logout()"><span class="ic">⏻</span>Salir</button>`}
function showView(v){document.querySelectorAll(".sb nav button,.mn button").forEach(b=>b.className="");
const nb=$("nav-"+v);if(nb)nb.className="act";const mb=$("mn-"+v);if(mb)mb.className="act";
const V={dashboard:renderDash,"nueva-visita":()=>{_visMode="visita";renderVisForm()},visitas:renderVisList,pedidos:renderPedList,clientes:renderClList,"nuevo-cliente":()=>renderClForm(),exportar:renderExport};
if(V[v])V[v]();window.scrollTo(0,0)}
function vF(){if(U.rol==="vendedor")return"&vendedor_id=eq."+U.vendedor_id;if(U.rol==="lider"&&supIds.length)return"&vendedor_id=in.("+supIds.join(",")+")";return""}
function vV(){if(U.rol==="vendedor")return vendedores.filter(x=>x.id===U.vendedor_id);if(U.rol==="lider")return vendedores.filter(x=>supIds.includes(x.id));return vendedores}
async function loadAll(){try{const[v,t,s,lp,p]=await Promise.all([api("crm_vendedores","GET",null,"?activo=eq.true&order=nombre"),api("crm_tipologias","GET",null,"?activo=eq.true&order=orden"),api("crm_sectores","GET",null,"?order=codigo"),api("crm_listas_precio","GET",null,"?activo=eq.true&order=nombre"),api("crm_productos","GET",null,"?activo=eq.true&order=nombre")]);vendedores=v||[];tipologias=t||[];sectores=s||[];listasP=lp||[];productos=p||[]}catch(e){showT(e.message,"error")}}
async function loadCl(){try{clientes=await api("crm_clientes","GET",null,"?order=nombre"+vF()+"&select=*,crm_vendedores(nombre,nit,codigo_vendedor),crm_tipologias!crm_clientes_tipologia_id_fkey(nombre),crm_listas_precio(nombre)")||[]}catch(e){showT(e.message,"error")}}
async function loadVis(f){try{let q="?order=created_at.desc&select=*,crm_vendedores(nombre),crm_clientes(nombre,codigo)"+vF();if(f)q+="&fecha=eq."+f;visitas=await api("crm_visitas","GET",null,q)||[]}catch(e){showT(e.message,"error")}}
async function loadPed(){try{pedidos=await api("crm_pedidos","GET",null,"?order=created_at.desc&select=*,crm_clientes(nombre,codigo),crm_vendedores(nombre,nit),crm_sucursales(codigo_sucursal)"+vF())||[]}catch(e){showT(e.message,"error")}}
// DASHBOARD
async function renderDash(){await loadCl();await loadVis(today());await loadPed();
const ph=pedidos.filter(p=>p.fecha===today()),tv=ph.reduce((s,p)=>s+(p.total||0),0);
$("mc").innerHTML=`<div class="topbar"><h2>📊 Dashboard — ${new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}</h2></div>
<div class="stats">
<div class="stat"><div class="bar" style="background:#818cf8"></div><div class="lb">Visitas hoy</div><div class="vl">${visitas.length}</div></div>
<div class="stat"><div class="bar" style="background:#10b981"></div><div class="lb">Pedidos hoy</div><div class="vl">${ph.length}</div></div>
<div class="stat"><div class="bar" style="background:var(--accent)"></div><div class="lb">Venta hoy</div><div class="vl">${fmt(tv)}</div></div>
<div class="stat"><div class="bar" style="background:#f59e0b"></div><div class="lb">Clientes</div><div class="vl">${clientes.length}</div></div></div>
${ph.length?`<div class="tw"><table><thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>${ph.map(p=>`<tr><td>${p.numero_pedido}</td><td style="font-weight:600">${p.crm_clientes?.nombre||""}</td><td style="font-weight:700">${fmt(p.total)}</td><td><span class="badge by">${p.estado}</span></td></tr>`).join("")}</tbody></table></div>`:""}`}
// VISITAS LIST
async function renderVisList(){await loadVis(today());
$("mc").innerHTML=`<div class="topbar"><h2>📋 Visitas hoy</h2><button class="btn bp bsm" onclick="showView('nueva-visita')">📍 Nueva</button></div>
<div class="tw"><table><thead><tr><th>Hora</th><th>Cliente</th><th>Resultado</th><th>Monto</th><th>Obs.</th></tr></thead>
<tbody>${visitas.length?visitas.map(v=>`<tr><td style="color:var(--muted)">${v.hora||""}</td><td style="font-weight:600">${v.crm_clientes?.nombre||""}</td><td><span class="badge ${v.resultado==="Pedido"?"bg":v.resultado==="Cotización"?"bb":"bgy"}">${v.resultado}</span></td><td style="font-weight:600">${v.resultado==="Pedido"?fmt(v.monto_pedido||0):"—"}</td><td style="color:var(--muted);font-size:11px">${v.observaciones||""}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">Sin visitas hoy</td></tr>'}</tbody></table></div>`}
// NUEVA VISITA - unified with pedido
let _gL=0,_gN=0;
async function renderVisForm(){

$("mc").innerHTML=`<div style="margin-bottom:16px"><button class="btn bs bsm" onclick="showView('visitas')">← Volver</button><h2 style="margin-top:8px">📍 Nueva visita</h2></div>

<div class="field"><label>Observaciones</label><textarea id="vf-obs" placeholder="Notas..."></textarea></div>

</div></div>
<div id="ped-area" style="display:none"></div>`;
window._vR="";window._vM="";
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{_gL=p.coords.latitude;_gN=p.coords.longitude;const e=$("vf-gps");if(e)e.innerHTML="📍 "+_gL.toFixed(5)+", "+_gN.toFixed(5)},()=>{const e=$("vf-gps");if(e)e.innerHTML="📍 No disponible"},{enableHighAccuracy:true,timeout:10000})}

function selVR(el,r){
document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("sel"));el.classList.add("sel");window._vR=r;
const mw=$("vf-mot"),cot=$("vf-cot");
// Pedido: hide everything else, save visita, show pedido tabs
if(r==="Pedido"){
if(mw)mw.style.display="none";if(cot)cot.style.display="none";
// Auto-save visita and switch to pedido
const clId=$("vf-cl")?.value;
if(!clId){showT("Selecciona cliente primero","error");document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("sel"));window._vR="";return}
_visClId=clId;
autoSaveVisitaAndShowPedido(clId);
return}
// Cotización: show monto/kilos
if(r==="Cotización"){if(mw)mw.style.display="none";if(cot)cot.style.display="block";return}
// Sin pedido/No atendido/Cerrado: show motivos
if(["Sin pedido","No atendido","Cerrado"].includes(r)){if(mw)mw.style.display="block";if(cot)cot.style.display="none";return}
// Seguimiento
if(mw)mw.style.display="none";if(cot)cot.style.display="none"}

function selVM(el,m){document.querySelectorAll(".mbtn").forEach(b=>b.classList.remove("sel"));el.classList.add("sel");window._vM=m}

async function autoSaveVisitaAndShowPedido(clId){
const vid=U.rol==="vendedor"?U.vendedor_id:U.vendedor_id;
const visita={cliente_id:clId,vendedor_id:vid,fecha:today(),hora:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",hour12:false}),resultado:"Pedido",monto_pedido:0,kg_pedido:0,latitud:_gL,longitud:_gN,observaciones:$("vf-obs")?.value||null};
try{
await api("crm_visitas","POST",visita);
showT("Visita registrada — Ahora toma el pedido");
// Hide visita form, show pedido tabs
$("vis-form-area").style.display="none";
$("ped-area").style.display="block";
pedLineas=[];pedTab=1;_pedData={cl:clId};
drawPedInline()
}catch(e){showT("Error guardando visita: "+e.message,"error")}}

async function saveVis(){
const clId=$("vf-cl")?.value,r=window._vR;if(!clId){showT("Selecciona cliente","error");return}if(!r){showT("Selecciona resultado","error");return}
const isCot=r==="Cotización",m=parseFloat($("vf-m")?.value)||0,k=parseFloat($("vf-k")?.value)||0;
const vid=U.rol==="vendedor"?U.vendedor_id:U.vendedor_id;
const p={cliente_id:clId,vendedor_id:vid,fecha:today(),hora:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",hour12:false}),resultado:r,monto_pedido:isCot?m:0,kg_pedido:isCot?k:0,motivo_sin_pedido:["Sin pedido","No atendido","Cerrado"].includes(r)?window._vM:null,latitud:_gL,longitud:_gN,observaciones:$("vf-obs")?.value||null};
const btn=$("vf-sv");btn.disabled=true;btn.textContent="Guardando...";
try{await api("crm_visitas","POST",p);showT("Visita registrada");showView("visitas")}
catch(e){showT(e.message,"error")}finally{btn.disabled=false;btn.textContent="Registrar visita"}}

// PEDIDO INLINE (inside visita view)
function drawPedInline(){

const clName=clientes.find(c=>c.id===selCl)?.nombre||"";
const co=clientes.map(c=>`<option value="${c.id}" ${c.id===selCl?"selected":""}>${c.codigo}. ${c.nombre}</option>`).join("");
const th=`<div class="tabs"><button class="${pedTab===1?"act":""}" onclick="pedTab=1;drawPedInline()">Pedido</button><button class="${pedTab===2?"act":""}" onclick="if(_pedData.cl){pedTab=2;drawPedInline()}else{showT('Completa Pedido','error')}">Detalle</button><button class="${pedTab===3?"act":""}" onclick="if(pedLineas.length){pedTab=3;drawPedInline()}else{showT('Agrega productos','error')}">Finalizar</button></div>`;
let ct="";
if(pedTab===1){
ct=`<div class="tab-body">
<div style="background:rgba(16,185,129,.1);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;color:#10b981">✓ Visita registrada para <strong>${clName}</strong>. Ahora toma el pedido.</div>
<div class="grid g2">
<div class="field"><label><span class="req">* </span>Cliente</label><select id="pd-cl" onchange="ldSuc()"><option value="">Seleccionar</option>${co}</select></div>
<div class="field"><label>Punto de Venta</label><select id="pd-suc"><option value="">Sede principal</option></select></div></div>
<div class="grid g3">
<div class="field"><label>Vendedor</label><input value="${U.nombre_display}" disabled style="opacity:.7"></div>
<div class="field"><label>Cond. Pago</label><select id="pd-cp"><option>CONTADO</option><option>1001 - 15 DIAS</option><option>1002 - 30 DIAS</option></select></div>
<div class="field"><label>Fecha Entrega</label><input type="date" id="pd-fe" value="${_pedData.fe||today()}"></div></div>
<div class="field"><label>Observaciones</label><textarea id="pd-obs">${_pedData.obs||""}</textarea></div>
<div class="fa"><button class="btn bp" onclick="goTab2()">Siguiente → Detalle</button></div></div>`;
setTimeout(()=>{if($("pd-cl")){$("pd-cl").value=selCl;ldSuc().then(()=>{if(_pedData.suc&&$("pd-suc"))$("pd-suc").value=_pedData.suc})}},30);
}else if(pedTab===2){
const sub=pedLineas.reduce((s,l)=>s+l.total,0);
const rows=pedLineas.map((l,i)=>`<tr><td style="font-weight:600">${l.codigo}</td><td>${l.nombre}</td><td style="color:var(--muted)">${l.unidad}</td><td><input type="number" min="1" value="${l.qty}" onchange="uLn(${i},this.value)"></td><td style="text-align:right">${fmtN(l.valor)}</td><td style="text-align:right;font-weight:700">${fmtN(l.total)}</td><td style="text-align:center"><button onclick="rLn(${i})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;font-weight:800">✕</button></td></tr>`).join("");
ct=`<div class="tab-body">
<div style="margin-bottom:16px"><label style="font-size:13px;font-weight:700;color:var(--accent);display:block;margin-bottom:8px">Producto:</label>
<div class="psr"><input id="ps-i" placeholder="Buscar producto..." oninput="sP(this.value)" autocomplete="off" style="font-size:15px;padding:12px 14px"><div class="psr-r" id="ps-r"></div></div></div>
<div style="overflow-x:auto"><table class="det-table"><thead><tr><th>Producto</th><th>Descripción</th><th>Uni. Med.</th><th>Cantidad</th><th>Vr. Unitario</th><th>Total</th><th></th></tr></thead>
<tbody>${rows||'<tr><td colspan="7" class="empty">Busca y agrega productos</td></tr>'}</tbody></table></div>
<div style="text-align:right;margin-top:10px;font-size:15px;font-weight:800">Subtotal: ${fmt(sub)}</div>
<div class="fa"><button class="btn bs" onclick="pedTab=1;drawPedInline()">← Pedido</button><button class="btn bp" onclick="if(pedLineas.length){pedTab=3;drawPedInline()}else{showT('Agrega productos','error')}">Siguiente → Finalizar</button></div></div>`;
}else{
const sub=pedLineas.reduce((s,l)=>s+l.total,0);
ct=`<div class="tab-body">
<div style="background:rgba(16,185,129,.1);padding:14px 18px;border-radius:8px;margin-bottom:20px;font-weight:700;font-size:15px;color:#10b981">Resumen:</div>
<div style="padding:0 8px">
<div class="resumen-row"><span>Valor Sin Descuento:</span><span>${fmtN(sub)}</span></div>
<div class="resumen-row discount"><span>Descuento:</span><span>0.00</span></div>
<div class="resumen-row"><span>SubTotal:</span><span>${fmtN(sub)}</span></div>
<div class="resumen-row total"><span>Total:</span><span>${fmt(sub)}</span></div></div>
<div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px">
<button class="btn bs" onclick="pedTab=2;drawPedInline()">← Detalle</button>
<button class="btn-enviar" id="pd-env" onclick="envPed()">✓ Enviar</button></div></div>`}
$("ped-area").innerHTML=`<h2 style="margin-bottom:16px">🛒 Tomar pedido</h2>${th}${ct}`}

function goTab2(){const cl=$("pd-cl")?.value;if(!cl){showT("Selecciona cliente","error");return}
_pedData={cl:cl,suc:$("pd-suc")?.value||null,cp:$("pd-cp")?.value||"CONTADO",fe:$("pd-fe")?.value||today(),obs:$("pd-obs")?.value||""};pedTab=2;drawPedInline()}
async function ldSuc(){const cid=$("pd-cl")?.value;const sel=$("pd-suc");if(!sel)return;sel.innerHTML='<option value="">Sede principal</option>';if(!cid)return;
try{const s=await api("crm_sucursales","GET",null,"?cliente_id=eq."+cid+"&activo=eq.true&order=codigo_sucursal");(s||[]).forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.codigo_sucursal+" - "+x.nombre+(x.direccion?" - Dir: "+x.direccion:"");sel.appendChild(o)})}catch(e){}}
function sP(q){const r=$("ps-r");if(!q){r.classList.remove("show");return}const ql=q.toLowerCase();const f=productos.filter(p=>p.nombre.toLowerCase().includes(ql)||p.codigo.includes(q));
r.innerHTML=f.length?f.slice(0,10).map(p=>`<div onclick="aLn('${p.id}')"><strong>${p.codigo}</strong> — ${p.nombre} — <strong>${fmt(p.valor_unitario)}</strong></div>`).join(""):'<div style="color:var(--muted)">Sin resultados</div>';r.classList.add("show")}
function aLn(pid){const p=productos.find(x=>x.id===pid);if(!p)return;const ex=pedLineas.find(l=>l.pid===pid);if(ex){ex.qty++;ex.total=ex.qty*ex.valor}else pedLineas.push({pid,codigo:p.codigo,nombre:p.nombre,valor:p.valor_unitario,unidad:p.unidad_medida||"PAQUNID",qty:1,total:p.valor_unitario});
if($("ps-i"))$("ps-i").value="";if($("ps-r"))$("ps-r").classList.remove("show");drawPedInline()}
function uLn(i,v){const q=parseInt(v)||1;pedLineas[i].qty=q;pedLineas[i].total=q*pedLineas[i].valor;drawPedInline()}
function rLn(i){pedLineas.splice(i,1);drawPedInline()}
async function envPed(){if(!_pedData.cl){showT("Sin cliente","error");return}if(!pedLineas.length){showT("Sin productos","error");return}
const sub=pedLineas.reduce((s,l)=>s+l.total,0);
const vid=U.rol==="vendedor"?U.vendedor_id:(clientes.find(c=>c.id===_pedData.cl)?.vendedor_id||U.vendedor_id);
const cab={cliente_id:_pedData.cl,sucursal_id:_pedData.suc||null,vendedor_id:vid,fecha:today(),fecha_entrega:_pedData.fe||today(),condicion_pago:_pedData.cp||"CONTADO",observaciones:_pedData.obs||null,subtotal:sub,descuento:0,total:sub,estado:"Pendiente",created_by:U.usuario};
const btn=$("pd-env");btn.disabled=true;btn.textContent="Enviando...";
try{const res=await api("crm_pedidos","POST",cab);if(res&&res[0]){const pid=res[0].id;
for(const l of pedLineas){await api("crm_pedido_detalle","POST",{pedido_id:pid,producto_id:l.pid,cantidad:l.qty,valor_unitario:l.valor,descuento_pct:0,valor_descuento:0,total:l.total})}
// Update visita monto with pedido total
showT("Pedido #"+res[0].numero_pedido+" enviado ✓");showView("pedidos")}}
catch(e){showT(e.message,"error")}finally{btn.disabled=false;btn.textContent="✓ Enviar"}}

function fCl(){const q=($("cf-s")?.value||"").toLowerCase();const f=clientes.filter(c=>!q||(c.nombre||"").toLowerCase().includes(q)||(c.codigo||"").includes(q)||(c.ciudad||"").toLowerCase().includes(q));

function renderClForm(c){editingId=c?c.id:null;

function uCiu(){const d=$("cf-dep").value,s=$("cf-ciu");s.innerHTML='<option value="">'+(d?"Sel.":"Sel. depto.")+'</option>';if(d&&DEPTOS[d])DEPTOS[d].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;s.appendChild(o)})}
function eCl(id){const c=clientes.find(x=>x.id===id);if(c)renderClForm(c)}
async function sCl(eid){const cod=$("cf-cod")?.value.trim(),nom=$("cf-nom")?.value.trim(),ciu=$("cf-ciu")?.value,dir=$("cf-dir")?.value.trim(),tel=$("cf-tel")?.value.trim();

async function exCl(){const d=$("ex-cd").value,h=$("ex-ch").value;
try{const cls=await api("crm_clientes","GET",null,`?fecha_ingreso=gte.${d}&fecha_ingreso=lte.${h}&select=*,crm_vendedores(nombre,nit,codigo_vendedor)`)||[];

function dl(c,fn){const b=new Blob(["\uFEFF"+c],{type:"text/csv;charset=utf-8;"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);showT("Descargado: "+fn)}
